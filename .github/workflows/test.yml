name: Tests

on:
  push:
    branches:
      - main
      - develop
      - production
  pull_request:
    branches:
      - main
      - develop
      - production

jobs:
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run flake8
      run: flake8 bridgelink/ --count --select=E9,F63,F7,F82 --show-source --statistics
      continue-on-error: true

    - name: Check code formatting with black
      run: black --check bridgelink/
      continue-on-error: true

    - name: Check import sorting with isort
      run: isort --check-only bridgelink/
      continue-on-error: true

    - name: Type checking with mypy
      run: mypy bridgelink/
      continue-on-error: true

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/setup.py') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Install test dependencies
      run: |
        pip install pytest pytest-cov pytest-mock

    - name: Run unit tests
      run: |
        pytest tests/ -v --cov=bridgelink --cov-report=xml --cov-report=term
      continue-on-error: true  # Don't fail if no tests yet

    - name: Test CLI commands
      run: |
        bridgelink --version
        bridgelink --help
        bridgelink devices --help
        bridgelink daemon --help
        bridgelink config --help

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-${{ matrix.os }}-${{ matrix.python-version }}
      continue-on-error: true

  install-test:
    name: Installation Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest, macos-latest]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Build package
      run: |
        python -m pip install --upgrade pip build
        python -m build

    - name: Install from wheel
      run: |
        pip install dist/*.whl

    - name: Test installed package
      run: |
        bridgelink --version
        bridgelink --help

    - name: Uninstall
      run: pip uninstall -y bridgelink

    - name: Install from source distribution
      run: |
        pip install dist/*.tar.gz

    - name: Test installed package again
      run: |
        bridgelink --version
        bridgelink --help

  platform-specific:
    name: Platform-Specific Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install package
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Test platform detection
      shell: python
      run: |
        from bridgelink.utils.bore_installer import BoreInstaller
        installer = BoreInstaller()
        print(f"Detected platform: {installer.platform}")
        assert installer.platform is not None

    - name: Test ADB installer platform detection
      shell: python
      run: |
        from bridgelink.utils.adb_installer import ADBInstaller
        installer = ADBInstaller()
        print(f"Detected platform: {installer.platform}")
        assert installer.platform is not None

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit

    - name: Run safety check
      run: safety check --json
      continue-on-error: true

    - name: Run bandit security scan
      run: bandit -r bridgelink/ -f json -o bandit-report.json
      continue-on-error: true

    - name: Upload security reports
      uses: actions/upload-artifact@v4
      with:
        name: security-reports
        path: |
          safety-report.json
          bandit-report.json
      continue-on-error: true
