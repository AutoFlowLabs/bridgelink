name: Version Bump

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'
      changelog_entry:
        description: 'Changelog entry (optional)'
        required: false
        type: string

jobs:
  bump-version:
    name: Bump Version
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bump2version

    - name: Configure git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Get current version
      id: current_version
      run: |
        VERSION=$(python -c "from bridgelink import __version__; print(__version__)")
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Current version: $VERSION"

    - name: Bump version
      id: bump
      run: |
        # Bump version in __init__.py and setup.py
        bump2version ${{ github.event.inputs.version_type }} --verbose --allow-dirty || true

        # Get new version
        NEW_VERSION=$(python -c "from bridgelink import __version__; print(__version__)")
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"

    - name: Update CHANGELOG.md
      run: |
        NEW_VERSION="${{ steps.bump.outputs.new_version }}"
        DATE=$(date +%Y-%m-%d)

        # Create CHANGELOG.md if it doesn't exist
        if [ ! -f CHANGELOG.md ]; then
          cat > CHANGELOG.md << 'EOF'
        # Changelog

        All notable changes to this project will be documented in this file.

        The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
        and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

        EOF
        fi

        # Prepare changelog entry
        CHANGELOG_ENTRY="${{ github.event.inputs.changelog_entry }}"
        if [ -z "$CHANGELOG_ENTRY" ]; then
          CHANGELOG_ENTRY="- Version bump to $NEW_VERSION"
        fi

        # Add new version entry to CHANGELOG
        cat > temp_changelog.md << EOF
        # Changelog

        ## [$NEW_VERSION] - $DATE

        ### Changed
        $CHANGELOG_ENTRY

        EOF

        # Append the rest of the old changelog
        tail -n +3 CHANGELOG.md >> temp_changelog.md
        mv temp_changelog.md CHANGELOG.md

    - name: Commit changes
      run: |
        git add bridgelink/__init__.py setup.py CHANGELOG.md
        git commit -m "Bump version to ${{ steps.bump.outputs.new_version }}"
        git push origin ${{ github.ref_name }}

    - name: Create summary
      run: |
        echo "## Version Bump Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Previous version**: ${{ steps.current_version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **New version**: ${{ steps.bump.outputs.new_version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Bump type**: ${{ github.event.inputs.version_type }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
        echo "1. Review the changes" >> $GITHUB_STEP_SUMMARY
        echo "2. Merge to production branch to trigger release" >> $GITHUB_STEP_SUMMARY
